version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:20"
      timezone: Europe/Dublin
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "build"
      include: scope
    groups:
      actions:
        patterns:
          - actions/*
          - github/*

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
