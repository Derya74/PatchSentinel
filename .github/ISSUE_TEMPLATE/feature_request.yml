name: Feature request
description: A signal, policy knob or output format you would use.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        PatchSentinel stays small on purpose. Please describe the measurement
        you want to make and the decision you want to make from it - that is
        what makes a proposal fit.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to decide?
      description: The judgement call you want the tool to inform.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed signal, knob or format
      description: What it measures, how it is computed, and what default you would suggest.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New signal (risk, repetition, test ratio, sensitive paths, review cost)
        - Policy schema or defaults
        - Output format (json, text, markdown, annotations)
        - CLI ergonomics
        - Renderer (HTML / GitHub summary)
        - Documentation
    validations:
      required: true

  - type: textarea
    id: determinism
    attributes:
      label: How is it deterministic?
      description: Same diff, same policy, same bytes - no clocks, randomness or ordering.
    validations:
      required: false

  - type: input
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false

  - type: checkboxes
    id: prior-art
    attributes:
      label: Prior art
      options:
        - label: I searched existing issues and discussions first
          required: true
        - label: This keeps the zero-dependency promise (no new runtime dependencies in `internal/`)
          required: false
