name: Bug report
description: PatchSentinel returned a verdict you believe is wrong, or failed to parse a diff.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A verdict is only as useful as the evidence
        attached to it - the smallest diff that still reproduces the problem
        is the fastest route to a fix.

  - type: input
    id: version
    attributes:
      label: PatchSentinel version
      description: Output of `patchsentinel -version`, or the release tag you used.
      placeholder: v1.0.0
    validations:
