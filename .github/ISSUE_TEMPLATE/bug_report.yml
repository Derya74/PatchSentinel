name: Bug report
description: PatchSentinel returned a verdict you believe is wrong, or failed to parse a diff.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A verdict is only as useful as the evidence
        attached to it - the smallest diff that still reproduces the problem
        is the fastest route to a fix.

  - type: input
    id: version
    attributes:
      label: PatchSentinel version
      description: Output of `patchsentinel -version`, or the release tag you used.
      placeholder: v1.0.0
    validations:
      required: true

  - type: dropdown
    id: go-or-web
    attributes:
      label: Which half
      options:
        - Go CLI
        - TypeScript renderer
        - Neither - the diff itself looks wrong
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command and flags you ran.
      placeholder: patchsentinel -policy examples/policy.strict.json -format text pr.diff
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The diff, or the smallest excerpt that still reproduces it.
      render: diff
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected output
      description: What PatchSentinel should have printed.
      render: text
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual output
      render: text
    validations:
      required: true

  - type: textarea
    id: policy
    attributes:
      label: Policy overrides
      description: Only if you pass `-policy`. Paste the JSON, or say "defaults".
