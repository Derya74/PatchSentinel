name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Vet
        run: go vet ./...
      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out
      - name: Build CLI
        run: go build -o bin/patchsentinel ./cmd/patchsentinel
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: patchsentinel-linux
          path: bin/patchsentinel

