<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="htitle hdesc" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace">
  <title id="htitle">PatchSentinel diff review gates</title>
  <desc id="hdesc">A unified diff enters from the left and passes four measured
    gates in order: risk score, test-to-code ratio, repetition, and sensitive
    paths. Its worst result becomes one verdict stamp: pass, warn, or fail.</desc>

  <rect width="900" height="300" fill="#1a1720"/>
  <rect x="0" y="0" width="6" height="300" fill="#2f9e6b"/>

  <text x="30" y="40" fill="#eae3f0" font-size="20" font-weight="700" letter-spacing="1">PatchSentinel</text>
  <text x="30" y="60" fill="#9a8fa8" font-size="12">a review desk between a diff and your main branch</text>

  <!-- input diff -->
  <g transform="translate(30 120)">
    <rect width="110" height="70" rx="6" fill="#241f2c" stroke="#3a3344"/>
    <text x="55" y="26" text-anchor="middle" fill="#eae3f0" font-size="12">unified</text>
    <text x="55" y="44" text-anchor="middle" fill="#eae3f0" font-size="12">diff</text>
    <text x="20" y="60" fill="#2f9e6b" font-size="13">+</text>
    <text x="82" y="60" fill="#d1495b" font-size="13">-</text>
  </g>

